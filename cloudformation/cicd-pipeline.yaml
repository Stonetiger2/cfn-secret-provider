AWSTemplateFormatVersion: '2010-09-09'
Resources:
  Project:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: cfn-secret-provider
      Description: 'cfn-secret-provider builder'
      ServiceRole: !Ref 'ProjectRole'
      Artifacts:
        Type: S3
        Location: !Ref BuildArtifactsBucket
        Path: builds
        NamespaceType: BUILD_ID
        Name: image-files.zip
        Packaging: ZIP
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true
      Source:
        Type: GITHUB
        Location: https://github.com/Stonetiger2/cfn-secret-provider.git
        BuildSpec: .buildspec.yaml
        GitCloneDepth: 0
        # Auth:
        #   Type: OAUTH
      # Triggers:
      #   FilterGroups:
      #    -  - Type: EVENT
      #         Pattern: PUSH
      #       - Type: HEAD_REF
      #         Pattern: "refs/tags/.*"
      #   Webhook: true

  ProjectRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: codebuild.amazonaws.com
            Condition: {}
      Path: /
      Policies:
        - PolicyName: LambdaBuilder
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeRegions
                  - ecr:GetAuthorizationToken
                Resource: 
                  - '*'

              - Effect: Allow
                Action:
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:BatchCheckLayerAvailability
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                Resource: 
                  - !Sub 'arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/xebia/cfn-secret-provider'

              - Sid: CloudWatchLogsPolicy
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - '*'

              - Sid: BuildArtifactsPolicy
                Effect: Allow
                Action:
                  - s3:GetBucketAcl
                  - s3:GetBucketLocation
                Resource: !GetAtt BuildArtifactsBucket.Arn

              - Sid: WriteBuildArtifactsPolicy
                Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub '${BuildArtifactsBucket.Arn}/*'

  BuildArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: xebia/cfn-secret-provider
      ImageTagMutability: MUTABLE
      RepositoryPolicyText:
        Version: '2012-10-17'
        Statement:
          - Sid: read only access
            Effect: Allow
            Principal:
              AWS:
                - '*'
            Action:
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
              - ecr:BatchCheckLayerAvailability

          - Sid: write to owner account
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action:
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
              - ecr:BatchCheckLayerAvailability
              - ecr:PutImage
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/codebuild/${Project}'
      RetentionInDays: 7

Outputs:
  BuildArtifactsBucketName:
    Description: Bucket containing builds/<build-id>/image-files.zip artifacts.
    Value: !Ref BuildArtifactsBucket

